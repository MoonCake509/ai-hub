# Реестр агентов AI-Hub.
# id       — стабильный идентификатор для API
# transport— способ обращения: cli | http | cdp | acp
# host     — где живёт агент: server | laptop
# status   — verified | unverified | planned

agents:
  - id: codex
    default_profile: openai
    profiles:
      - id: openai
        name: OpenAI (подписка Codex)
        models:
          - gpt-5.3-codex
          - gpt-5.2-codex
          - gpt-5.1-codex
          - gpt-5-codex
      - id: oss
        name: Open-source (llama.cpp)
        models:
          - dolphin-2.9-llama3-8b.Q4_K_M
    name: Codex CLI
    transport: cli
    host: laptop
    status: verified
    bridge_agent: codex
    command: "codex exec --json --skip-git-repo-check"
    notes: "бинарь вне PATH: AppData/Local/OpenAI/Codex/bin/*/codex.exe"

  - id: openclaw-laptop
    default_profile: claudehub
    profiles:
      - id: claudehub
        name: ClaudeHub (claudehub)
        models:
          - claude-opus-5
          - claude-sonnet-4.5
          - claude-haiku-4
      - id: router-cheap
        name: Router.cheap
        models:
          - deepseek-v4.1-flash
          - gpt-6.1-sol
          - qwen3.8-max
    name: OpenClaw (ноутбук)
    transport: cli
    host: laptop
    status: verified
    bridge_agent: openclaw
    command: "openclaw agent --message-file <file> --json"
    notes: "gateway только на loopback, ходим через CLI"

  - id: hermes-laptop
    default_profile: claudehub
    profiles:
      - id: claudehub
        name: ClaudeHub (claudehub)
        models:
          - deepseek-v4.1-flash
          - claude-opus-5
          - claude-sonnet-4.5
      - id: router-cheap
        name: Router.cheap
        models:
          - deepseek-v4.1-flash
          - gpt-6.1-sol
          - qwen3.8-max
    name: Hermes (ноутбук)
    transport: cli
    host: laptop
    status: verified
    bridge_agent: hermes
    command: "hermes -z <prompt>"
    notes: "режим одного запроса; через хаб — pull-воркер ноутбука"

  - id: qwen-code
    default_profile: qwen-sub
    profiles:
      - id: qwen-sub
        name: Qwen (подписка)
        models:
          - qwen3.8-max
          - qwen3.8-plus
          - qwen3.8-flash
    name: Qwen Desktop
    transport: cdp
    host: laptop
    status: verified
    bridge_agent: qwen
    notes: "только через CDP/DOM, API нет"

  - id: llm-server
    default_profile: local
    profiles:
      - id: local
        name: Локальный llama.cpp
        models:
          - dolphin-2.9-llama3-8b.Q4_K_M
    name: llama.cpp Dolphin 8B (сервер)
    transport: http
    host: server
    status: verified
    bridge_agent: llm-server
    model: dolphin-2.9-llama3-8b.Q4_K_M
    notes: "127.0.0.1:11434, OpenAI-совместимый; ctx 8192, max_tokens 1024"

  - id: hermes-server
    default_profile: claudehub
    profiles:
      - id: claudehub
        name: ClaudeHub (сервер)
        models:
          - deepseek-v4.1-flash
          - claude-opus-5
          - claude-sonnet-4.5
      - id: router-cheap
        name: Router.cheap (сервер)
        models:
          - deepseek-v4.1-flash
          - gpt-6.1-sol
          - qwen3.8-max
    name: Hermes (сервер)
    transport: cli
    host: server
    status: verified
    bridge_agent: hermes-server
    command: "hermes -z <prompt>"

  - id: openclaw-server
    default_profile: claudehub
    profiles:
      - id: claudehub
        name: ClaudeHub (сервер)
        models:
          - claude-opus-5
          - claude-sonnet-4.5
          - claude-haiku-4
      - id: router-cheap
        name: Router.cheap (сервер)
        models:
          - deepseek-v4.1-flash
          - gpt-6.1-sol
          - qwen3.8-max
    name: OpenClaw (сервер)
    transport: cli
    host: server
    status: verified
    bridge_agent: openclaw-server
    command: "openclaw agent --message-file <file> --json"

  - id: qwen-server
    default_profile: qwen-sub
    profiles:
      - id: qwen-sub
        name: Qwen (подписка, сервер)
        models:
          - qwen3.8-max
          - qwen3.8-plus
          - qwen3.8-flash
    name: Qwen Desktop (сервер)
    transport: cdp
    host: server
    status: verified
    bridge_agent: qwen-server
    notes: "CDP 9333, node qwen.js; требует авторизации в приложении"
