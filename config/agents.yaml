# Реестр агентов AI-Hub.
# id       — стабильный идентификатор для API
# transport— способ обращения: cli | http | cdp | acp
# host     — где живёт агент: server | laptop
# configured — карточка заполнена в реестре; доступность и качество — в observations API
# probe    — пассивная проба DIAG-02; хост-сервисы из контейнера видны по шлюзу bridge (172.18.0.1)

agents:
  - id: codex
    default_profile: router-cheap
    supports_workdir: true
    profiles:
      - id: router-cheap
        name: Router.cheap (API)
        native_provider: router.cheap
        models:
          - deepseek-v4.1-flash-1017
          - claude-fable-5
          - claude-fable-5-1
          - claude-haiku-5-5
          - glm-5.3
          - kimi-k3
          - grok-4.7
      - id: openai
        name: OpenAI (подписка Codex)
        models:
          - gpt-6.1-sol
          - gpt-6-astra
          - gpt-6-chat-thinking
          - gpt-6.1-terra
          - gpt-6-sol
          - gpt-reserve
          - gpt-6-luna
          - gpt-5.6-sol
          - gpt-5.6-terra
          - gpt-5.6-luna
    # Уровни Codex CLI (-c model_reasoning_effort). Действуют для всех моделей канала;
    # каталог воркера, если он есть, остаётся главнее.
    reasoning:
      levels: [minimal, low, medium, high, xhigh]
      default: medium
    name: Codex CLI
    model_selection: true
    transport: cli
    host: server
    configured: true
    capabilities:
      text: {supported: true, evidence: "catalog"}
      patch: {supported: true, evidence: "fixture:core02b-apply-patch"}
      workdir: {supported: true, evidence: "fixture:core02b-live"}
      commands: {supported: true, evidence: "fixture:core02b-live"}
      usage: {supported: true, evidence: "catalog"}
      streaming: {supported: false, evidence: "catalog", reason: "CLI отдаёт финальный JSON; поток в работе не используется"}
      stop: {supported: false, evidence: "catalog", reason: "подтверждённая остановка процесса не реализована"}
      output_control: {supported: true, evidence: "catalog"}
      thinking: {supported: true, evidence: "catalog", reason: "уровни Codex CLI через -c model_reasoning_effort"}
    bridge_agent: codex
    command: "codex exec --json --skip-git-repo-check"
    notes: "бинаря нет в PATH: AppData/Local/OpenAI/Codex/bin/*/codex.exe; список моделей из ~/.codex/models_cache.json"

