# Пассивные пробы сервисов, которые видит контейнер хаба (DIAG-02).
# Пробы агентов на хосте выполняет воркер (DIAG-03): 127.0.0.1 хоста из контейнера
# принимает TCP, но не отвечает по HTTP.
services:
  - id: litellm
    name: LiteLLM (прокси моделей)
    probe:
      kind: http_json
      url: http://litellm:4000/v1/models
      timeout_s: 4
      bearer_env: LITELLM_MASTER_KEY
      expect:
        status: 200
        require_keys: ["data"]
  - id: postgres
    name: Postgres (очередь заданий)
    probe:
      kind: tcp_port
      host: "{db_host}"
      port: 5432
      timeout_s: 3
