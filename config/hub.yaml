# Настройки хаба, которые не являются секретами.
projects:
  # Единое рабочее пространство: новые проекты создаются только здесь.
  root: 'R:\AIHub\WorkSpace'
  # Диски/корни, где вообще разрешено работать агентам.
  allowed_roots:
    - 'R:\AIHub\WorkSpace'
    - 'R:\'
  # Внутренний ярлык машины, где живёт рабочий воркер (для человека это «сервер»).
  default_host: 'server'
  # Корень проектов на каждом хосте. Проект живёт на одном хосте; агенту с
  # другого хоста путь переводится в его локальный корень.
  host_roots:
    server: 'R:\AIHub\WorkSpace'
    laptop: 'C:\AIHub\WorkSpace'
