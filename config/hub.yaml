# Настройки хаба, которые не являются секретами.
projects:
  # Корень рабочих папок новых проектов. Каждый проект получает отдельный каталог
  # с safe-slug и коротким ID, инициализируется Git и регистрируется в хабе.
  root: 'R:\Projects'
  # Диски/корни, где человек может выбрать рабочую папку проекта.
  allowed_roots:
    - 'R:\Projects'
    - 'R:\'