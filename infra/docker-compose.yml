services:
  postgres:
    image: postgres:16-alpine
    container_name: aihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: aihub-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 4000 на хосте занят пробросом в WSL; наружу отдаём 4001.
      - "127.0.0.1:4001:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://llmproxy:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      ROUTER_CHEAP_KEY: ${ROUTER_CHEAP_KEY}
      ROUTER_CHEAP_BASE: ${ROUTER_CHEAP_BASE}
      CLAUDEHUB_KEY: ${CLAUDEHUB_KEY}
      CLAUDEHUB_BASE: ${CLAUDEHUB_BASE}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    logging:
      options:
        max-size: "10m"
        max-file: "3"


  hub:
    build: ../hub
    container_name: aihub-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    ports:
      # 8000/8443 на хосте заняты пробросом в WSL (netsh portproxy) — публикуем UI на 8090.
      - "0.0.0.0:8090:8000"
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      AGENTS_FILE: /app/config/agents.yaml
      HUB_TOKEN: ${HUB_TOKEN}
      DATABASE_URL: postgresql://llmproxy:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LEASE_SECONDS: "${LEASE_SECONDS:-300}"
      MAX_QUEUE: "${MAX_QUEUE:-50}"
      MAX_PROMPT_CHARS: "${MAX_PROMPT_CHARS:-20000}"
      TLS_CERT: /certs/hub.crt
      TLS_KEY: /certs/hub.key
      MAX_RESULT_CHARS: "${MAX_RESULT_CHARS:-100000}"
      BRIDGE_URL: ${BRIDGE_URL}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN}
    volumes:
      # Каталог целиком: хаб читает и agents.yaml, и hub.yaml (корень проектов).
      - ../config:/app/config:ro
      - ../web:/app/web:ro
      - ../hub/app:/app/app:ro
      - ./certs:/certs:ro
      # Рабочее пространство проектов: загрузки и архив удалённых проектов.
      - R:/AIHub:/workspace
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "-m", "app.serve"]

volumes:
  pgdata:
    # Immutable name: the volume must not depend on the compose project name.
    # A previous `-p aihub` run silently created an empty project-scoped volume and
    # the service came up on a blank database (2026-11-10 incident).
    name: aihub_pgdata
    driver: local
